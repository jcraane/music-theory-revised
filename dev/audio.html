<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Audio sandbox · Chord Lab</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/app.css">
  <style>
    .sandbox { display: grid; gap: var(--space-6); }
    .row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
    button, select {
      font: inherit;
      padding: var(--space-2) var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
      color: var(--color-text);
      cursor: pointer;
    }
    .steps { display: flex; flex-wrap: wrap; gap: var(--space-2); min-height: 2.5rem; }
    .step {
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      transition: background-color 80ms, color 80ms;
    }
    .step.is-active { background: var(--color-accent); color: var(--color-accent-text); }
    .muted { color: var(--color-text-muted); font-size: var(--font-size-sm); }
  </style>
  <script type="module" src="audio.js"></script>
</head>
<body>
  <main class="sandbox">
    <div>
      <h1>Audio sandbox</h1>
      <p class="muted">Developer page for trying the audio engine. Not part of the app.</p>
      <p class="muted" id="status">Audio starts after your first click or key press.</p>
    </div>

    <section class="row" aria-label="Settings">
      <label>Instrument
        <select id="instrument">
          <option value="keys">Keys</option>
          <option value="pad">Pad</option>
        </select>
      </label>
      <label>Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    </section>

    <section class="row" aria-label="Single sounds">
      <button id="note">Play C</button>
      <button id="chord">Play C major</button>
      <button id="arpeggio">Arpeggiate C major</button>
    </section>

    <section>
      <div class="row">
        <button id="scale">C major scale, up and down</button>
        <button id="loop">Loop I–V–vi–IV</button>
        <label><input id="swap" type="checkbox"> Swap Am for A major</label>
        <button id="stop">Stop</button>
      </div>
      <p class="muted">Highlights should change exactly when you hear each step.</p>
      <div class="steps" id="steps" aria-live="off"></div>
    </section>
  </main>
</body>
</html>
